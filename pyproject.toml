[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
  {email = "vic.boussange@gmail.com", name = "Victor Boussange"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: GIS"
]
dependencies = [
  "jax>=0.11",
  "equinox>=0.13.2",
  "tqdm>=4.66.1",
  "numpy>2.4.0",
  "lineax>=0.1.0"
]
description = 'A JAX library for connectivity modelling at scale'
keywords = ["jax", "graph", "machine-learning", "network"]
license = {file = "LICENSE"}
name = "jaxscape"
readme = "README.md"
requires-python = ">=3.12"
version = "0.0.17"

[project.optional-dependencies]
amjax = [
  "amjax>=0.0.3,<0.1",
  "pyamg>=5.1.0"
]
benchmark = [
  "matplotlib>=3.9",
  "optimistix>=0.0.10",
  "pyamg>=5.1.0"
]
cholespy = [
  "cholespy>=2.2.0"
]
cuda = [
  "jax[cuda]>=0.11"
]
# spineax 0.0.5 ships one CUDA 13 wheel (Linux x86-64, Python >= 3.12) built
# against cuDSS 0.x; cuDSS 1.0 is unsupported until spineax issues #29/#30.
cudss = [
  "spineax==0.0.5; python_version >= '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cudss-cu13>=0.8,<1; python_version >= '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'"
]
dev = [
  "ipykernel>=6.29.5"
]
docs = [
  "mkdocs>=1.5.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.24.0",
  "pymdown-extensions>=10.7.0",
  "mkdocs-include-exclude-files==0.1.0",
  "mkdocs-ipynb==0.1.1"
]
examples = [
  "matplotlib",
  "rioxarray",
  "flax",
  "optimistix",
  "geopandas",
  "scikit-learn"
]
# The pre-commit hooks run these tools from the project environment.
lint = [
  "pre-commit>=4.0",
  "pyright[nodejs]==1.1.414",
  "ruff==0.17.4"
]
pyamg = [
  "pyamg>=5.1.0"
]
tests = [
  "networkx>=3.4",
  "pytest>=8.3.5",
  "pytest-xdist>=3.6"
]

[project.urls]
Documentation = "https://github.com/vboussange/jaxscape#readme"
Issues = "https://github.com/vboussange/jaxscape/issues"
Source = "https://github.com/vboussange/jaxscape"

[tool.pyright]
# The benchmark is a project of its own (#74), outside the hooks' scope.
exclude = ["tests/test_benchmark.py"]
include = ["src", "tests"]
# CI runs on Linux: check every platform as Linux, to get the same result.
pythonPlatform = "Linux"
reportIncompatibleMethodOverride = true

[tool.pytest.ini_options]
# The default run leaves out the tests marked `gpu` or `slow`. Run them with
# `pytest -m gpu` or `pytest -m slow`, or every test with `-m ""`.
addopts = "-m 'not gpu and not slow'"
markers = [
  "gpu: needs an NVIDIA GPU with spineax and cuDSS",
  "slow: slow tests, which CI runs"
]
# Benchmark correctness tests import the repository-local benchmark package.
pythonpath = ["."]

[tool.ruff]
extend-include = ["*.ipynb"]
src = []

[tool.ruff.lint]
fixable = ["I001", "F401", "UP"]
ignore = ["E402", "E721", "E731", "E741", "F722"]
select = ["E", "F", "I001", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true
extra-standard-library = ["typing_extensions"]
lines-after-imports = 2
order-by-type = false
