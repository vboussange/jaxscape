# The configuration of the benchmark: how cells run, the cases, the shared
# parameters of each distance, and one entry per tool and question.

[run]
timeout = 3600           # seconds that a call may take
repeats = 5              # timed calls after the warm-up call
single_call_after = 300  # seconds of warm-up after which one timed call follows
cores = "80-95"          # 16 physical cores of gpunode05, on NUMA node 5, that of GPU 5
gpu = "5"                # the GPU of GPU cells, numbered as nvidia-smi numbers it
smoke_side = 32
smoke_dependency_range = 10  # windows of E2 and E3 in smoke mode
# The largest Tier 1 error that smoke mode passes. The smoke run's errors reach
# 1.1e-5, with JAXScape's float32 resistance, and a tool that takes the
# arithmetic mean of the permeabilities as the conductance of an edge errs by
# 2e-2 to 3e-2.
smoke_tolerance = 1e-4

# The synthetic landscape (see landscape.py).
[landscape]
correlation_length = 25
habitat_threshold = 0.7
seed = 74

[E1]
sites = 32
seed = 75
reference = "adapters/reference.py"  # the adapter of the float64 reference

# The raster sides of each distance, and its shared parameters.
[distances.resistance]
sides = [256, 1024, 4096, 8192]

[distances.lcp]
sides = [256, 1024, 4096, 8192]

[distances.free_energy]
sides = [256, 1024]
# E1 resolves in float64 up to 0.011, and not at 0.0115, on 1024^2 (#78).
theta = 0.01

# The windows of E2 and E3: Omniscape's `radius` and `block_size` in its
# Maryland example, blocks of 21 pixels.
[windows]
dependency_range = 100
coarsening_factor = 0.2

# The Maryland case of E2 and E3 (see landscape.py), which install.sh
# downloads: the resistance of each NLCD class from Omniscape's example, whose
# classes 23 and 24, medium- and high-intensity development, are barriers.
[maryland]
raster = "data/nlcd_2016_frederick_md.tif"
questions = ["E2", "E3"]
resistance = { 11 = 100, 21 = 500, 22 = 1000, 31 = 100, 41 = 1, 42 = 1, 43 = 1, 52 = 20, 71 = 30, 81 = 200, 82 = 300, 90 = 20, 95 = 30 }

# One entry per tool and question. `adapter` runs a cell, and the table of a
# distance holds the tool's settings for it, `dtype` and `solver` included. A
# setting given per device is a table keyed by device. A tool of E2 or E3 is
# compared with the map of JAXScape's GPU cell under the distance
# `compared_with`, by default its own. `package` names the tool in the pins of
# its toolchain, which give its version, by default the tool's name without
# `.jl`.
[[tools]]
tool = "JAXScape"
question = "E1"
adapter = "adapters/jaxscape.py"
devices = ["gpu", "cpu"]
tier = 1

# The reference settings: the defaults of JAXScape 0.0.16, in float32.
[tools.distances.resistance]
dtype = "float32"
solver = "GridMultigridSolver"

[tools.distances.lcp]
dtype = "float32"

# Across the whole raster, float32 resolves no free-energy distance at any
# theta, and the default dense solve does not fit: E1 takes float64 and the
# direct solver that the docs give for each device.
[tools.distances.free_energy]
dtype = "float64"
solver = { gpu = "CuDSSSolver", cpu = "CholmodSolver" }

# E2 and E3 take the reference settings of E1, with the `batch_size` of the
# tuning run (#78), except for resistance, which takes the setting of the
# connectivity example of the docs: exact resistance took 24 min a call of E3
# at 1024^2, and would take 32 h at 8192^2. Its `batch_size`, 51^2, gives E3
# at 8192^2 the fewest tiles at which it runs fastest, 64, with a peak of
# 6.3 GiB on an RTX 3090, and keeps 1024^2 in one tile. Least-cost computes
# each window on its own, and its `batch_size` is the fastest at 8192^2. They
# leave free energy out:
# its window query holds the dense inverse of the 40401 pixels of a window,
# and in float64, the only precision that resolves its windows, one window
# ran out of the 24 GB of the GPU, and out of memory on the CPU after taking
# 300 GB.
[[tools]]
tool = "JAXScape"
question = "E2"
adapter = "adapters/jaxscape.py"
devices = ["gpu", "cpu"]

[tools.distances.resistance]
dtype = "float32"
solver = "GridMultigridSolver(rtol=3e-4)"
method = "SpielmanApproximation(epsilon=0.15)"
batch_size = 2601

[tools.distances.lcp]
dtype = "float32"
batch_size = 512

[[tools]]
tool = "JAXScape"
question = "E3"
adapter = "adapters/jaxscape.py"
devices = ["gpu", "cpu"]

[tools.distances.resistance]
dtype = "float32"
solver = "GridMultigridSolver(rtol=3e-4)"
method = "SpielmanApproximation(epsilon=0.15)"
batch_size = 2601

[tools.distances.lcp]
dtype = "float32"
batch_size = 512

[[tools]]
tool = "Circuitscape.jl"
question = "E1"
adapter = "adapters/circuitscape.jl"
devices = ["cpu"]
tier = 1

[tools.distances.resistance]
solver = ["cg+amg", "cholmod"]

[[tools]]
tool = "ConScape.jl"
question = "E1"
adapter = "adapters/conscape.jl"
devices = ["cpu"]
tier = 1

[tools.distances.free_energy]

# ConScape.jl's maps, under free energy, are compared with JAXScape's under
# least-cost distance: JAXScape has no free-energy map, and least-cost distance
# ranks pairs of sites most like free energy at its theta (see the adapter).
[[tools]]
tool = "ConScape.jl"
question = "E2"
adapter = "adapters/conscape.jl"
devices = ["cpu"]
tier = 3
compared_with = "lcp"

[tools.distances.free_energy]

[[tools]]
tool = "ConScape.jl"
question = "E3"
adapter = "adapters/conscape.jl"
devices = ["cpu"]
tier = 3
compared_with = "lcp"

[tools.distances.free_energy]

[[tools]]
tool = "gdistance"
question = "E1"
adapter = "adapters/gdistance.R"
devices = ["cpu"]
tier = 1

[tools.distances.resistance]

[tools.distances.lcp]

[[tools]]
tool = "skimage.graph.MCP"
package = "scikit-image"
question = "E1"
adapter = "adapters/skimage.py"
devices = ["cpu"]
tier = 1

[tools.distances.lcp]

# EcoScape and samc map flows under no distance of their own: the distance of
# each is the JAXScape distance its map is compared with, which its adapter
# justifies.
[[tools]]
tool = "EcoScape"
package = "ecoscape-connectivity"
question = "E3"
adapter = "adapters/ecoscape.py"
devices = ["gpu"]
tier = 3

# The largest batch of simulations whose tiles fit in the 24 GB of an RTX 3090
# (8 runs out).
[tools.distances.lcp]
dtype = "float32"
batch_size = 4

[[tools]]
tool = "samc"
question = "E3"
adapter = "adapters/samc.R"
devices = ["cpu"]
tier = 3

[tools.distances.resistance]
solver = "direct"

# E2 against eco-connectivity and Graphab, both under least-cost distances.
[[tools]]
tool = "eco-connectivity"
question = "E2"
adapter = "adapters/eco_connectivity.py"
devices = ["cpu"]
tier = 2

[tools.distances.lcp]
dtype = "float32"

[[tools]]
tool = "Graphab"
package = "graphab"  # the jar of install.sh, java/graphab-<version>.jar
question = "E2"
adapter = "adapters/graphab.py"
devices = ["cpu"]
tier = 3

[tools.distances.lcp]

[[tools]]
tool = "Omniscape.jl"
question = "E3"
adapter = "adapters/omniscape.jl"
devices = ["cpu"]
tier = 3

[tools.distances.resistance]
solver = ["cg+amg", "cholmod"]

# The solver view (#83): JAXScape with each solver, in float32 and float64 on
# the GPU, on the cases of E1, E2 and E3. A record's error is measured against
# the reference of E1 for E1, and for E2 and E3 against the map of exact
# resistance in float64 with `reference_solver`, on the same tiles. Free
# energy does not run on windows (see E2), so E2 and E3 take resistance alone.
[solver_view]
tool = "JAXScape"
adapter = "adapters/jaxscape.py"
device = "gpu"
dtypes = ["float32", "float64"]
reference_solver = "CuDSSSolver"
# A call of the solver view stops after 15 minutes. At 256^2, one call of E2
# or E3 took 2 to 5 minutes with GridMultigridSolver and CuDSSSolver in
# float32, and more than 10 with CholmodSolver and PyAMGSolver, which solve on
# the CPU: at an hour, their timeouts alone would take 8 hours.
timeout = 900
# The combinations that fail by design, which the solver view leaves out; an
# entry matches each combination whose fields hold its values. Free energy in
# float32 resolves no distance across the raster (see E1), and the iterative
# solvers, GridMultigridSolver, AMJaxCGSolver and PyAMGSolver, resolve no free
# energy in either dtype: in the run of v0.0.16, GridMultigridSolver failed to
# resolve it in float64 at 256^2. AMJaxCGSolver returns non-finite output in
# float32, in E1, from 256^2 in the run of v0.0.16, as on the windows of E2
# and E3.
fails_by_design = [
  { distance = "free_energy", dtype = "float32" },
  { distance = "free_energy", solver = ["GridMultigridSolver", "AMJaxCGSolver", "PyAMGSolver"] },
  { solver = "AMJaxCGSolver", dtype = "float32" },
]

# The distances of each question, with the settings that every solver shares.
# E1 runs on every raster of its distance, as in the comparison. E2 and E3 run
# on 256^2 alone (`sides`), and leave Maryland out: exact windowed resistance
# takes about 23 minutes a call at 1024^2 with GridMultigridSolver in float32
# (#78), against 2 at 256^2.
[solver_view.questions.E1]
resistance = {}
free_energy = {}

[solver_view.questions.E2]
resistance = { batch_size = 256, sides = [256] }

[solver_view.questions.E3]
resistance = { batch_size = 256, sides = [256] }

# One entry per solver: the label of its records, and the settings that it
# adds; `questions` and `dtypes` restrict where it runs. `dense` is the dense
# solve, `solver=None`.
[solver_view.solvers]
GridMultigridSolver = {}
CholmodSolver = {}
CuDSSSolver = {}
AMJaxCGSolver = {}
PyAMGSolver = {}
dense = {}
# The setting of the comparison for resistance in E2 and E3, whose error
# against exact resistance the solver view measures.
"SpielmanApproximation(epsilon=0.15), GridMultigridSolver(rtol=3e-4)" = { solver = "GridMultigridSolver(rtol=3e-4)", method = "SpielmanApproximation(epsilon=0.15)", questions = ["E2", "E3"], dtypes = ["float32"] }
