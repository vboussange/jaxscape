# Notes on the run of v0.0.16, which the report adds after the table of each
# section: Markdown keyed by question, or by `Solvers`.

E1 = """\
At 8192², JAXScape 0.0.16 runs out of GPU memory for resistance distances: its \
nodes-to-nodes query solves for the 32 sites at once, and \
`jit_nodes_to_nodes_distance` asks for a single buffer of 44.98 GiB, 180 times \
the raster in float32 and nearly twice the 24 GiB of the RTX 3090. This is a \
limit of JAXScape 0.0.16, which offers no way to solve fewer sites at a time; \
the same query takes 308 s on the CPU. The errors of resistance at 8192² are \
missing: CHOLMOD stops their float64 reference with `problem too large`.\
"""

E3 = """\
