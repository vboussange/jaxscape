# Ruff and pyright run from the project environment, at the versions pinned by
# the `lint` extra, so that the hooks, editors and CI agree. Install it with
# the extras of CONTRIBUTING.md, then run every hook on every file with
# `uv run pre-commit run --all-files`, as CI does.

# The benchmark is a project of its own (#74), outside the hooks' scope.
exclude: ^benchmark/|^tests/test_benchmark\.py$

repos:
  - repo: local
    hooks:
      - id: sort_pyproject
        name: sort_pyproject
        entry: toml-sort -i --sort-table-keys --sort-inline-tables
        language: python
        files: ^pyproject\.toml$
        additional_dependencies: ["toml-sort==0.23.1"]
      - id: ruff
        name: ruff
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff-format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi, jupyter]
      # Pyright checks the scope of the project's configuration as a whole, so
      # that a change also surfaces the errors it causes in files it leaves.
      - id: pyright
        name: pyright
        entry: uv run --no-sync pyright
        language: system
        pass_filenames: false
        files: ^(src/|tests/|pyproject\.toml$)
