name: Build documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BENCHMARK_THREADS: "4"
      JULIA_DEPOT_PATH: ${{ github.workspace }}/benchmark/.julia
      R_LIBS_USER: ${{ github.workspace }}/benchmark/.r-lib
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure Git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set cache ID
        id: cache-id
        run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_OUTPUT"
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ steps.cache-id.outputs.cache_id }}
          path: ~/.cache 
          restore-keys: |
            mkdocs-material-

      - name: Cache benchmark toolchains
        uses: actions/cache@v4
        with:
          key: benchmark-toolchains-${{ runner.os }}-${{ hashFiles('benchmark/install_external_tools.sh', 'benchmark/external/install_r_packages.R', 'benchmark/julia/Project.toml') }}
          path: |
            benchmark/.julia
            benchmark/.r-lib
          restore-keys: |
            benchmark-toolchains-${{ runner.os }}-

      - name: Install system libraries for benchmark R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libgdal-dev libgeos-dev libproj-dev libudunits2-dev libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install the project
        run: uv sync --extra docs --extra benchmark

      - name: Install external benchmark toolchains
        run: ./benchmark/install_external_tools.sh

      - name: Run benchmark suite
        run: ./benchmark/run_benchmarks.sh --device cpu --require-complete

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts
          path: |
            benchmark/results/benchmark_results.json
            benchmark/results/benchmark_results.csv
            docs/assets/benchmark_*.png
        
      - name: Build and deploy documentation
        run: |
          uv run mkdocs gh-deploy --force