name: Run tests

on:
  pull_request:

  push:
    branches:
      - main
    tags: '*'

jobs:
  # Every pre-commit hook on every file, in the project environment.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra lint --extra tests --extra docs --extra pyamg --extra amjax --extra cholespy

      - name: Run pre-commit hooks
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  run-tests:
    strategy:
      matrix:
        python-version: 
          - "3.13"
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra tests --extra docs --extra pyamg --extra amjax --extra cholespy

      # Every test but those marked `gpu`, the slow ones included, with one
      # pytest-xdist worker per core.
      - name: Run tests
        run: uv run pytest -n auto -m "not gpu" tests

      - name: Build documentation
        run: uv run mkdocs build --strict

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
